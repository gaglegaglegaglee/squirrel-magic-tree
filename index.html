<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#301b23" />
    <title>피라미드 건설</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="start-screen" class="screen start-screen" aria-labelledby="game-title">
        <div class="sun" aria-hidden="true"></div>
        <div class="pyramid pyramid-back" aria-hidden="true"></div>
        <div class="pyramid pyramid-front" aria-hidden="true"></div>
        <div class="title-card">
          <p class="eyebrow">끝없이 오르는 사막 퍼즐</p>
          <h1 id="game-title">피라미드 건설</h1>
          <p class="intro">움직이는 바위를 멈춰 나만의 피라미드 길을 만드세요.</p>
          <div class="best-summary" aria-live="polite">
            <span>개인 최고</span>
            <strong><span id="start-best-height">0</span> m · <span id="start-best-walked">0</span>칸</strong>
          </div>
          <button id="start-button" class="primary-button" type="button">게임 시작</button>
          <button id="start-help-button" class="text-button" type="button">도움말</button>
          <button id="reset-record-button" class="text-button" type="button">최고 기록 초기화</button>
          <p id="start-storage-warning" class="storage-warning" role="status" hidden>
            기록을 이 기기에 저장하지 못했습니다.
          </p>
        </div>
      </section>

      <section id="game-screen" class="screen game-screen" aria-label="피라미드 건설 게임" hidden>
        <header class="hud" aria-live="polite">
          <div class="hud-item">
            <span class="hud-label">체력</span>
            <strong id="health-value">100</strong>
            <button id="exit-button" class="hud-button" type="button">나가기</button>
            <button id="game-help-button" class="hud-button" type="button">도움말</button>
          </div>
          <div class="hud-title">피라미드 건설</div>
          <div class="hud-item hud-item-right">
            <span class="hud-label">현재 높이</span>
            <strong><span id="height-value">0</span> m</strong>
          </div>
        </header>
        <div class="canvas-frame">
          <canvas
            id="game-canvas"
            width="1600"
            height="900"
            aria-label="주인공과 바위 열 개를 놓을 빈칸이 있는 사막 게임판"
          ></canvas>
          <p id="game-status" class="game-status" aria-live="polite">
            바위가 원하는 칸 위에 왔을 때 게임판을 터치하세요.
          </p>
        </div>
      </section>

      <section
        id="result-overlay"
        class="result-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="result-title"
        hidden
      >
        <div class="result-card">
          <p class="eyebrow">도전 결과</p>
          <h2 id="result-title">피라미드 건설 종료</h2>
          <div class="result-grid">
            <div><span>이번 높이</span><strong><span id="result-height">0</span> m</strong></div>
            <div><span>통과한 칸</span><strong><span id="result-walked">0</span>칸</strong></div>
            <div class="result-best">
              <span>개인 최고</span>
              <strong><span id="result-best-height">0</span> m · <span id="result-best-walked">0</span>칸</strong>
            </div>
          </div>
          <p id="result-storage-warning" class="storage-warning" role="status" hidden>
            기록을 이 기기에 저장하지 못했습니다.
          </p>
          <button id="restart-button" class="primary-button" type="button">다시 시작</button>
        </div>
      </section>

      <section
        id="tutorial-overlay"
        class="tutorial-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tutorial-title"
        hidden
      >
        <div class="tutorial-card">
          <p class="eyebrow">게임 방법 <span id="tutorial-step-number">1 / 3</span></p>
          <h2 id="tutorial-title">피라미드 건설 안내</h2>
          <p id="tutorial-text" class="tutorial-text"></p>
          <button id="tutorial-next-button" class="primary-button" type="button">다음</button>
        </div>
      </section>

      <section id="orientation-overlay" class="orientation-overlay" role="alert" hidden>
        <div aria-hidden="true" class="rotate-icon">↻</div>
        <strong>화면을 가로로 돌려주세요</strong>
        <p>게임을 계속하려면 조금 더 넓은 가로 공간이 필요합니다.</p>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
